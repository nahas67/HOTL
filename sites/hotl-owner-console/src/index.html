<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="description" content="HOTL owner workspace: an interactive design preview with sample commerce data and a separate recorded project checkpoint. No live commerce connection.">
  <title>Dashboard · HOTL</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <aside class="sidebar" aria-label="Workspace sidebar">
    <a class="brand" href="#dashboard" aria-label="HOTL dashboard"><strong>HOTL</strong><span>Commerce OS</span></a>
    <nav id="desktop-nav" class="navigation" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom"><p id="private-label"></p><a href="#settings" class="owner-profile"><span class="owner-avatar">H</span><span>Workspace owner</span></a></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button id="mobile-menu" type="button" class="icon-button mobile-only" data-action="menu" aria-label="Open navigation"></button>
      <div class="breadcrumbs"><span>Workspace</span><span>/</span><strong id="breadcrumb">Dashboard</strong></div>
      <div class="topbar-actions"><button type="button" id="open-search" class="search-trigger" data-action="search" aria-label="Search workspace"></button><button type="button" id="theme-toggle" class="icon-button" data-action="theme" aria-label="Switch to dark theme"></button><button type="button" id="notifications" class="icon-button" data-action="notices" aria-label="View launch readiness notices"></button></div>
    </header>
    <div class="content-wrap">
      <div id="mode-banner" class="mode-banner" role="note"></div>
      <main id="main-content" tabindex="-1"></main>
      <footer class="page-footer"><span>HOTL · Human on the Loop Commerce</span><span id="footer-mode"></span></footer>
    </div>
  </div>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="search-title">Search workspace</h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Close search"></button></div><label class="search-dialog-input"><span class="sr-only">Find a page or sample record</span><input id="global-search" type="search" placeholder="Search pages, products, or orders" autocomplete="off"></label><div id="search-results"></div><div class="search-footer">Tab to move through results · Enter to open · Esc to close</div></div></dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div class="dialog-inner"><div class="dialog-head"><div><p id="detail-subtitle"></p><h2 id="detail-title"></h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="Close details"></button></div><div id="detail-body"></div></div></dialog>
  <dialog id="mobile-dialog" class="mobile-dialog" aria-labelledby="mobile-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="mobile-title">HOTL workspace</h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Close navigation"></button></div><nav id="mobile-nav" class="navigation" aria-label="Mobile navigation"></nav></div></dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="notice">JavaScript is required for the interactive preview. No business services are connected.</p></noscript>
</body>
</html>
